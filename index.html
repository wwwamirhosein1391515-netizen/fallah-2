<style>
:root{--bg:#f6f7fb;--ac:#ffb800;--tx:#1c2140;--mu:#6a7194;--bd:rgba(30,40,90,.12);--cd:#fff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
*:focus{outline:none}[hidden]{display:none!important}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,rgba(255,184,0,.12),transparent),var(--bg);color:var(--tx);min-height:100dvh;padding-top:calc(56px + env(safe-area-inset-top));overflow-x:hidden;-webkit-user-select:none;user-select:none}
button,input,textarea{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
#hd{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(54px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;justify-content:center;align-items:center;background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--bd)}
#lg{pointer-events:none;-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none;height:54px;width:auto;animation:lg .8s cubic-bezier(.2,.9,.3,1) both}
@keyframes lg{from{opacity:0;transform:translateY(-14px) scale(.8)}to{opacity:1;transform:none}}
#mb{position:absolute;right:max(10px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 8px);width:38px;height:38px;border-radius:14px;display:grid;place-items:center;transition:background .2s,transform .15s}
#mb:active{transform:scale(.9);background:var(--cd)}
#mb i{display:block;width:5px;height:5px;border-radius:50%;background:var(--tx);margin:2px 0}
#mo{position:fixed;inset:0;z-index:40;display:none}#mo.open{display:block}
#mn{position:fixed;z-index:41;right:max(10px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 52px);min-width:190px;padding:6px;border-radius:16px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--bd);transform-origin:top right;transform:scale(.85);opacity:0;visibility:hidden;transition:transform .22s cubic-bezier(.2,.9,.3,1),opacity .18s,visibility .22s}
#mn.open{transform:none;opacity:1;visibility:visible}
#mn button{display:block;width:100%;text-align:right;padding:13px 14px;border-radius:11px;font-size:15px}
#mn button:active{background:var(--cd)}
main{max-width:1100px;margin:0 auto;padding:8px 14px 40px}
.wl{text-align:center;color:var(--mu);font-size:14px;margin:0 0 8px;animation:up .7s .15s both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
#sl{position:relative;direction:ltr;overflow:hidden;border-radius:20px;aspect-ratio:16/9;width:100%;max-width:900px;margin:5px auto 10px;cursor:pointer;transition:height .45s cubic-bezier(.22,.8,.26,1);background:#e9ecf5;touch-action:pan-y;border:1px solid var(--bd);animation:up .8s .2s both}
@media(max-width:920px){#sl{width:calc(100% + 12px);max-width:none;margin:5px -6px 10px}}
#tr{display:flex;height:100%;will-change:transform}
.sd{flex:0 0 100%;position:relative;height:100%;overflow:hidden}
.sd .bg{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(22px) brightness(.95)}
.sd img{position:relative;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
#dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
#dots i{width:7px;height:7px;border-radius:7px;background:rgba(255,255,255,.75);box-shadow:0 0 4px rgba(0,0,0,.45);transition:width .3s,background .3s}
#dots i.on{width:22px;background:var(--ac)}
#ch{position:sticky;top:calc(env(safe-area-inset-top) + 58px);z-index:20;display:flex;width:100%;max-width:560px;margin:0 auto 12px;padding:4px;overflow-x:auto;scrollbar-width:none;border-radius:99px;background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--bd);box-shadow:0 6px 20px rgba(30,40,90,.09);animation:up .8s .3s both}
#ch::-webkit-scrollbar{display:none}
#ch button{position:relative;z-index:1;flex:1 1 0;text-align:center;padding:9px 4px;border-radius:99px;font-size:14px;font-weight:600;color:var(--mu);transition:color .3s}
#ch button.on{color:#1a1200}#ch .ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:99px;background:rgba(255,184,0,.6);background:color-mix(in srgb,var(--ac) 60%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 4px 14px rgba(255,184,0,.28);transition:transform .5s cubic-bezier(.22,.8,.26,1),width .5s cubic-bezier(.22,.8,.26,1)}
#gr{transition:opacity .15s;display:grid;grid-template-columns:1fr;gap:14px;max-width:900px;margin:0 auto}
@media(max-width:920px){#gr{margin:0 -6px}}

.cd{box-shadow:0 4px 14px rgba(30,40,90,.07);background:var(--cd);border:1px solid var(--bd);border-radius:18px;overflow:hidden;cursor:pointer;opacity:0;transition:transform .2s}
.cd.in{opacity:1;animation:cin .55s cubic-bezier(.2,.9,.3,1) var(--d,0s) backwards}@keyframes cin{from{opacity:0;transform:translateY(22px)}}
.cd:active{transform:scale(.97)}
.th{position:relative;aspect-ratio:4/3;background:#e9ecf5;overflow:hidden;display:grid;place-items:center}
.th img,.th video{width:100%;height:100%;object-fit:cover;display:block}
img,video,audio,canvas{-webkit-touch-callout:none;-webkit-user-drag:none;-webkit-user-select:none;user-select:none}
.th img,.th video,#vc img,.sd img{pointer-events:none}
.th .pl{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;font-size:18px}
.th .ic{font-size:44px}.rw{box-shadow:0 2px 8px rgba(30,40,90,.05)}
.th p{padding:12px;font-size:13px;line-height:1.9;color:var(--mu);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-align:center;white-space:pre-line}
.cd h3{font-size:14px;padding:10px 12px 2px}.cd small{display:block;padding:0 12px 12px;font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.em{text-align:center;color:var(--mu);padding:40px 0}
footer{text-align:center;color:var(--mu);font-size:12px;padding:10px 14px 24px}
#fc{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:10px}#fc:empty{display:none}
#fc a{padding:7px 16px;border-radius:99px;background:#fff;border:1px solid var(--bd);color:var(--tx);font-size:13px;font-weight:600;text-decoration:none;box-shadow:0 2px 8px rgba(30,40,90,.06)}
#fc a:active{transform:scale(.96)}
.dv{margin-top:8px;line-height:2.1}.dv b{color:var(--tx);font-weight:600}
.dots{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:7px;pointer-events:none;z-index:2}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--ac);animation:dj .75s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.12s}.dots i:nth-child(3){animation-delay:.24s}
@keyframes dj{0%,100%{transform:translateY(7px);opacity:.45}50%{transform:translateY(-7px);opacity:1}}
#sl .dots{display:none}#sl.ldg .dots{display:flex}
.ov{position:fixed;inset:0;z-index:50;background:rgba(20,25,50,.45);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.ov.open{opacity:1;visibility:visible}
.pn{width:100%;max-width:440px;max-height:86dvh;overflow:auto;background:#fff;border:1px solid var(--bd);border-radius:22px;padding:16px;transform:translateY(26px) scale(.97);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.ov.open .pn{transform:none}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:14px}.ph b{font-size:16px}
.bk{padding:9px 14px;border-radius:12px;background:var(--cd);border:1px solid var(--bd);font-size:13px;white-space:nowrap}.bk:active{transform:scale(.94)}.bk.x{font-size:22px;line-height:1;padding:6px 14px}
.f{display:block;width:100%;padding:13px 14px;margin-bottom:10px;border-radius:13px;background:#f1f3fa;border:1px solid var(--bd);font-size:16px;transition:border-color .2s}
.f:focus{border-color:var(--ac)}
textarea.f{min-height:110px;resize:vertical}
.bt{width:100%;padding:14px;border-radius:14px;background:var(--ac);color:#1a1200;font-weight:800;font-size:15px;transition:transform .15s,opacity .2s}.bt:active{transform:scale(.97)}.bt:disabled{opacity:.5}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;margin-bottom:8px;border-radius:14px;background:var(--cd);border:1px solid var(--bd);color:inherit;text-decoration:none;font-size:14px}
.rw span{color:var(--mu);direction:ltr;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.ck{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ck label{cursor:pointer}.ck input{display:none}
.ck span{display:block;padding:9px 16px;border-radius:99px;background:var(--cd);border:1px solid var(--bd);font-size:14px;transition:all .2s}
.ck input:checked+span{background:var(--ac);color:#1a1200;border-color:var(--ac);font-weight:600}
.ms{font-size:13px;margin:4px 0 10px;min-height:20px;text-align:center}.ms.er{color:#d93a3a}.ms.ok{color:#1f9d55}
#vw{padding:0;background:rgba(8,11,24,.96);color:#fff;flex-direction:column;align-items:stretch;justify-content:flex-start}
#vb{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:max(12px,env(safe-area-inset-right));z-index:3;width:44px;height:44px;padding:0;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-size:26px;line-height:1;transition:transform .15s}#vb:active{transform:scale(.9)}
#vc{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 64px) 10px calc(env(safe-area-inset-bottom) + 12px);transform:scale(.96);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
#vw.open #vc{transform:none}
#vc .mw{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#vc .mw.t{justify-content:flex-start;overflow:auto}
#vc img,#vc video{max-width:100%;max-height:calc(100dvh - 190px);object-fit:contain;border-radius:10px}
#vc video{width:100%}#vc audio{width:100%;max-width:520px}
#vc .inf{flex:none;max-height:26%;overflow:auto;text-align:center;max-width:640px}
#vc h2{font-size:17px}#vc .d{color:rgba(255,255,255,.72);font-size:14px;line-height:2;margin-top:4px}
#vc .tx{max-width:640px;width:100%;line-height:2.3;font-size:17px;white-space:pre-wrap;-webkit-user-select:text;user-select:text}.tx.p{text-align:center}
#vc .big{font-size:90px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cd{opacity:1;transform:none}}

tr.innerHTML=a.map((s,k)=>`<div class="sd"><img src="${e(s.image_url)}" alt="" draggable="false" decoding="async"${k?'':' fetchpriority="high"'}></div>`).join('');
$('dots').innerHTML=a.map(()=>'<i></i>').join('');go(L.i,1);auto();sweep(tr)}

const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{rootMargin:'0px 0px -5% 0px'});
function card(c,k){let th;if(c.type==='image')th=`<img ${k<6?`fetchpriority="${k<2?'high':'auto'}"`:'loading="lazy"'} decoding="async" src="${e(c.url)}" alt="" draggable="false"><b class="dots"><i></i><i></i><i></i></b>`;else if(c.type==='video')th=`<video src="${e(c.url)}#t=0.1" preload="metadata" muted playsinline controlsList="nodownload noremoteplayback" disablePictureInPicture disableRemotePlayback></video><b class="dots"><i></i><i></i><i></i></b><div class="pl">▶</div>`;else if(c.type==='audio')th=`<div class="ic">${IC.audio}</div>`;else th=`<p>${e(c.body)}</p>`;
return `<article class="cd" data-id="${c.id}" style="--d:${(k%6)*50}ms"><div class="th">${th}</div><h3>${e(c.title||T[c.type])}</h3><small>${e(c.description||T[c.type])}</small></article>`}
let cs='';

function rG(){const l=D.c.filter(c=>F==='all'||c.type===F);$('em').hidden=!ready||!!l.length;$('gr').innerHTML=l.map(card).join('');$('gr').querySelectorAll('.cd').forEach(x=>io.observe(x));sweep($('gr'))}
let ready=false;
function rC(){const tp=Object.keys(T);const g=tp.join();
if(g!==cs){cs=g;if(F!=='all'&&!tp.includes(F))F='all';$('ch').innerHTML='<i class="ind"></i>'+['all',...tp].map(k=>`<button data-k="${k}">${k==='all'?'همه':T[k]}</button>`).join('')}
chips();requestAnimationFrame(ind);rG()}
addEventListener('resize',()=>{ind();fit(L.i,1)});try{document.fonts.ready.then(ind)}catch(_){}
$('ch').onclick=ev=>{const b=ev.target.closest('button');if(!b||b.dataset.k===F)return;F=b.dataset.k;chips();try{b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}catch(_){}const g=$('gr');g.style.opacity=0;setTimeout(()=>{rG();g.style.opacity=1},160)};
function openV(h){$('vc').innerHTML=h;sweep($('vc'));show($('vw'))}
$('gr').onclick=ev=>{const x=ev.target.closest('.cd');if(!x)return;const c=D.c.find(i=>i.id==x.dataset.id);if(!c)return;let m,t='';
if(c.type==='image')m=`<img src="${e(c.url)}" alt="" draggable="false"><b class="dots"><i></i><i></i><i></i></b>`;else if(c.type==='video')m=`<video src="${e(c.url)}" controls autoplay playsinline preload="auto" controlsList="nodownload noremoteplayback" disablePictureInPicture disableRemotePlayback></video><b class="dots"><i></i><i></i><i></i></b>`;else if(c.type==='audio')m=`<div class="big">${IC.audio}</div><audio src="${e(c.url)}" controls autoplay controlsList="nodownload noremoteplayback"></audio>`;else{t=' t';m=`<div class="tx ${c.type==='poem'?'p':''}">${e(c.body)}</div>`}
openV(`<div class="mw${t}">${m}</div>`+((c.title||c.description)?`<div class="inf">${c.title?`<h2>${e(c.title)}</h2>`:''}${c.description?`<p class="d">${e(c.description)}</p>`:''}</div>`:''))};
sl.addEventListener('click',()=>{if(Math.abs(dx)>6)return;const q=D.sl[L.i];if(q)openV(`<div class="mw"><img src="${e(q.image_url)}" alt="" draggable="false"><b class="dots"><i></i><i></i><i></i></b></div>`)});
/* settings */
function rS(s){D.s=s;const r=document.documentElement.style;if(s.accent)r.setProperty('--ac',s.accent);if(s.bg){r.setProperty('--bg',s.bg)}INT=Math.max(1,+s.interval||3)*1000;$('wl').textContent=s.welcome||'';$('wl').hidden=!s.welcome;$('ft').textContent=s.footer||'';if(s.title)document.title=s.title}
/* load */
function rF(){$('fc').innerHTML=D.ct.filter(c=>c.url).map(c=>`<a href="${e(c.url)}" target="_blank" rel="noopener">${e(c.label)}</a>`).join('')}
function apply(d){ready=true;rS(d.s||{});D.ct=d.ct||[];rF();D.c=d.c||[];const g=JSON.stringify(d.c);if(g!==sig.c){sig.c=g;rC()}rSlides(d.sl||[])}
rC();
try{const c=JSON.parse(localStorage.getItem('cache')||'null');if(c){D.sl=c.sl;apply(c)}}catch(_){}
async function load(){try{const[s,sl,c,ct]=await Promise.all([get('settings?select=data'),get('slides?select=*&order=sort.asc,id.asc'),get('contents?select=*&order=created_at.desc'),get('contacts?select=*&order=sort.asc,id.asc')]);const d={s:(s[0]&&s[0].data)||{},sl,c,ct};apply(d);try{localStorage.setItem('cache',JSON.stringify(d))}catch(_){}}catch(_){}}
load();
/* visit */
try{if(!sessionStorage.v){sessionStorage.v=1;let v=localStorage.vid;if(!v){v=(crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random().toString(36).slice(2));localStorage.vid=v}post('visits',{vid:v}).catch(()=>{})}}catch(_){}
/* notifications */
function notify(x){const o={body:T[x.type]+' جدید: '+(x.title||''),tag:'c'+x.id,dir:'rtl',lang:'fa'};try{reg?reg.showNotification('عمو فلاح',o):new Notification('عمو فلاح',o)}catch(_){}}
async function poll(){try{const s=JSON.parse(localStorage.getItem('sub')||'null');if(!s||!('Notification' in window)||Notification.permission!=='granted')return;const r=await get('contents?select=id,type,title,created_at&created_at=gt.'+encodeURIComponent(s.last)+'&order=created_at.asc');if(!r.length)return;s.last=r[r.length-1].created_at;localStorage.setItem('sub',JSON.stringify(s));r.filter(x=>s.cats.includes(x.type)).slice(-3).forEach(notify);load()}catch(_){}}
setInterval(()=>{poll();load()},30000);poll();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){poll();load();auto()}});
